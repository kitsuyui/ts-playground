name: Release

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Comma-separated public package directories to publish from this tag"
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    # "released" events are emitted either when directly be released or be edited from pre-released.
    types: [prereleased, released]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          # https://nodejs.org/en/about/previous-releases
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Check npm version for Trusted Publishing
        run: |
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)' "$(npm --version)"

      - name: install and build
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run validate

      - name: Validate tagged publish request
        if: github.event_name == 'workflow_dispatch'
        run: |
          test "${GITHUB_REF_TYPE}" = tag
          printf '%s' "${GITHUB_REF_NAME}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'
          test -n "${{ inputs.packages }}"

      - name: Set tag rc
        if: github.event_name == 'pull_request'
        run: |
          git config user.email "dummy@dummy"
          git config user.name "dummy"
          # dummy tag for dry-run
          git tag "v999.999.999-rc.${GITHUB_RUN_NUMBER}"

      - name: set git tag version
        run: |
          git config user.email "dummy@dummy"
          git config user.name "dummy"
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            VERSION="0.0.0-rc.${GITHUB_RUN_NUMBER}"
          fi
          for dir in . packages/*; do
            (cd "$dir" && bun pm pkg set version="$VERSION")
          done
          bun run format

      - name: Select packages and validate workspace dependencies
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_PACKAGES: ${{ inputs.packages }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const allowed = fs.readdirSync('packages').filter(dir => !JSON.parse(fs.readFileSync(path.join('packages', dir, 'package.json'))).private);
          const selected = process.env.REQUESTED_PACKAGES.split(',').map(value => value.trim()).filter(Boolean);
          if (!selected.length || new Set(selected).size !== selected.length || selected.some(dir => !allowed.includes(dir))) throw new Error('packages must be a unique, non-private package directory allowlist');
          const selectedNames = new Set(selected.map(dir => JSON.parse(fs.readFileSync(path.join('packages', dir, 'package.json'))).name));
          for (const dir of selected) {
            const pkg = JSON.parse(fs.readFileSync(path.join('packages', dir, 'package.json')));
            for (const field of ['dependencies', 'optionalDependencies', 'peerDependencies']) for (const [name, spec] of Object.entries(pkg[field] || {})) {
              if (spec.startsWith('workspace:') && !selectedNames.has(name)) throw new Error(`${pkg.name} requires selected workspace dependency ${name}`);
            }
          }
          fs.writeFileSync(process.env.RUNNER_TEMP + '/publish-packages', selected.map(dir => `packages/${dir}`).join('\n') + '\n');
          NODE

      - name: Resolve workspace dependencies for npm publishing
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dirs = fs.readdirSync('packages').map(name => path.join('packages', name));
          const manifests = dirs.map(dir => ({file: path.join(dir, 'package.json'), pkg: JSON.parse(fs.readFileSync(path.join(dir, 'package.json'), 'utf8'))}));
          const versions = new Map(manifests.map(({pkg}) => [pkg.name, pkg.version]));
          for (const {file, pkg} of manifests) {
            for (const field of ['dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies']) {
              for (const [name, spec] of Object.entries(pkg[field] || {})) {
                if (!spec.startsWith('workspace:')) continue;
                if (!versions.has(name)) throw new Error(`Unknown workspace dependency: ${name}`);
                const suffix = spec.slice('workspace:'.length);
                if (!['*', '^', '~'].includes(suffix)) throw new Error(`Unsupported workspace range: ${spec}`);
                pkg[field][name] = suffix === '*' ? versions.get(name) : suffix + versions.get(name);
              }
            }
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          }
          NODE

      - name: Verify versions are not already published
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          while IFS= read -r dir; do
            name="$(node -p "require('./' + process.argv[1] + '/package.json').name" "$dir")"
            if npm view "$name@$VERSION" version dist.integrity dist.tarball --json >/tmp/npm-version.json 2>/dev/null; then
              cat /tmp/npm-version.json
              echo "Refusing to treat an existing version as trusted: verify its provenance against this tag and workflow before any retry." >&2
              exit 1
            fi
          done < "$RUNNER_TEMP/publish-packages"

      - name: deploy selected packages
        # https://docs.npmjs.com/generating-provenance-statements
        run: |
          set -eu
          while IFS= read -r dir; do
            (cd "$dir" && npm publish --access public)
          done < "$RUNNER_TEMP/publish-packages"
        if: github.event_name == 'workflow_dispatch'

      - name: deploy (dry-run)
        run: |
          set -eu
          for dir in packages/*; do
            if grep -q '"private": true' "$dir/package.json"; then
              continue
            fi
            (cd "$dir" && npm publish --access public --dry-run --tag next)
          done
        if: github.event_name != 'workflow_dispatch'
